
<form id="fundingApplicationForm"
      action="https://api.web3forms.com/submit"
      method="POST">

    <!-- REQUIRED: Replace with your real Web3Forms access key -->
    <input type="hidden" name="access_key"
           value="9cee0982-9062-40f1-846b-44e05fb7b80c">

    <!-- Email subject -->
    <input type="hidden" name="subject"
           value="New Funding Application - Peoples Financial Group">

    <!-- Sender identification -->
    <input type="hidden" name="from_name"
           value="Peoples Financial Group Website">

    <!-- Spam protection -->
    <input type="checkbox" name="botcheck"
           style="display:none">

    <div class="formgrid">

        <div>
            <label for="fullName">Full Name *</label>
            <input id="fullName" type="text"
                   name="Full Name"
                   autocomplete="name" required>
        </div>

        <div>
            <label for="company">Company / Organization *</label>
            <input id="company" type="text"
                   name="Company"
                   autocomplete="organization" required>
        </div>

        <div>
            <label for="email">Email *</label>
            <input id="email" type="email"
                   name="email"
                   autocomplete="email" required>
        </div>

        <div>
            <label for="phone">Phone / WhatsApp *</label>
            <input id="phone" type="tel"
                   name="Phone"
                   autocomplete="tel" required>
        </div>

        <div>
            <label for="country">Country *</label>
            <input id="country" type="text"
                   name="Country"
                   autocomplete="country-name" required>
        </div>

        <div>
            <label for="amount">Amount Required (USD) *</label>
            <input id="amount" type="text"
                   name="Amount Required (USD)"
                   placeholder="e.g. 50,000,000"
                   required>
        </div>

    </div>

    <label for="projectType">Project / Business Type *</label>
    <input id="projectType" type="text"
           name="Project Type" required>

    <label for="description">Brief Description *</label>
    <textarea id="description"
              name="Description" required></textarea>

    <label for="useOfFunds">Proposed Use of Funds</label>
    <textarea id="useOfFunds"
              name="Use of Funds"></textarea>

    <label>
        <input type="checkbox" name="Privacy Consent"
               value="Accepted" required>
        I agree to the processing of my information
        in accordance with the Privacy Policy.
    </label>

    <button class="btn gold" id="submitButton" type="submit">
        Submit Funding Enquiry
    </button>

    <p id="formStatus" role="status"
       aria-live="polite"></p>

</form>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("fundingApplicationForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("formStatus");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        button.disabled = true;
        button.textContent = "Submitting...";
        status.textContent = "Please wait while we process your application.";

        try {

            const response = await fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                headers: {
                    "Accept": "application/json"
                }
            });

            const result = await response.json();

            if (!response.ok || result.success !== true) {
                throw new Error(
                    result.message || "Submission failed."
                );
            }

            // Redirect only after successful submission.
            window.location.href = new URL(
                "thank-you.html",
                window.location.href
            ).href;

        } catch (error) {

            status.textContent =
                "We could not submit your application. Please check your connection and try again.";

            button.disabled = false;
            button.textContent = "Submit Funding Enquiry";

            console.error("Funding application error:", error);

        }

    });

});
</script>
